# Build settings for a Google AI Studio app (Vite + React).
# These override the build command and publish directory set in the Netlify UI.
[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app fallback so client-side routes don't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
